services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: valentine
      POSTGRES_PASSWORD: valentine
      POSTGRES_DB: valentine
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U valentine -d valentine"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: oven/bun:1.2
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./New-live-main:/app
      - app_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - NEXT_TELEMETRY_DISABLED=1
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      - NEXT_PUBLIC_WS_URL=https://3001-${BASE44_PUBLIC_HOST_SUFFIX}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "bun install && bunx prisma db push --accept-data-loss && bunx next dev -p 3000 -H 0.0.0.0"

  ws:
    image: oven/bun:1.2
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./New-live-main/mini-services/node-ws:/app
      - ws_node_modules:/app/node_modules
    ports:
      - "3001:3001"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PORT=3001
      - APP_URL=${APP_URL:-https://3000-${BASE44_PUBLIC_HOST_SUFFIX}}
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "bun install && bun run dev"

volumes:
  pgdata:
  app_node_modules:
  ws_node_modules:
